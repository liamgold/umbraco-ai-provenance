name: Release packages

# Runs when a version tag is pushed, for example 17.0.0 or 17.0.0-beta1. It builds and tests both packages,
# then publishes them to NuGet with the tag as their version.
#
# It publishes with NuGet Trusted Publishing, so no long-lived API key is stored in the repository.
# GitHub issues a short-lived token for this run, nuget.org checks it against the trusted publishing
# policy for this repository and this workflow file, and returns an API key that lasts one hour.
# https://learn.microsoft.com/nuget/nuget-org/trusted-publishing
#
# One-off setup:
#   1. On nuget.org: your username > Trusted Publishing > add a policy with
#        Repository Owner: liamgold    Repository: umbraco-ai-provenance    Workflow File: release.yml
#   2. In this repository: Settings > Secrets and variables > Actions > add the secret NUGET_USER,
#      set to your nuget.org username (the profile name, not your email address)

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write  # lets this job ask GitHub for the token that nuget.org checks

    env:
      VERSION: ${{ github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Umbraco.Community.AIProvenance/Client/package-lock.json

      # The backoffice adds the version to the extension's URL, so browsers load the new files after an upgrade.
      - name: Set the backoffice extension version
        working-directory: src/Umbraco.Community.AIProvenance/Client
        run: |
          jq --arg version "$VERSION" '.version = $version' public/umbraco-package.json > umbraco-package.tmp
          mv umbraco-package.tmp public/umbraco-package.json

      - name: Build the backoffice extension
        working-directory: src/Umbraco.Community.AIProvenance/Client
        run: |
          npm ci
          npm run build

      - name: Build
        run: dotnet build src/Umbraco.Community.AIProvenance.slnx -c Release /p:Version=$VERSION

      - name: Test
        run: dotnet test tests/Umbraco.Community.AIProvenance.Tests -c Release --no-build --blame-hang-timeout 5m

      - name: Pack
        run: |
          dotnet pack src/Umbraco.Community.AIProvenance/Umbraco.Community.AIProvenance.csproj -c Release --no-build -o artifacts /p:Version=$VERSION
          dotnet pack src/Umbraco.Community.AIProvenance.UmbracoAI/Umbraco.Community.AIProvenance.UmbracoAI.csproj -c Release --no-build -o artifacts /p:Version=$VERSION

      # Ask for the key just before pushing: it is only valid for one hour.
      - name: NuGet login (exchange the GitHub token for a short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" -k ${{ steps.login.outputs.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json --skip-duplicate
