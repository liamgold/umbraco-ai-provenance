name: Publish to NuGet

# Runs when a GitHub release is published. The release's tag, without a leading "v", is the package version,
# for example v17.0.0-beta.1 gives 17.0.0-beta.1. It builds and tests both packages, then publishes them.
#
# It publishes with NuGet Trusted Publishing, so no API key is stored in the repository. nuget.org needs
# a trusted publishing policy for this repository with the workflow file release.yml.
# https://learn.microsoft.com/nuget/nuget-org/trusted-publishing

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The tag is the version, with or without a leading "v": v17.0.0-beta.1 and 17.0.0-beta.1 both give 17.0.0-beta.1.
      - name: Read the version from the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Umbraco.Community.AIProvenance/Client/package-lock.json

      # The backoffice adds the version to the extension's URL, so browsers load the new files after an upgrade.
      - name: Set the backoffice extension version
        working-directory: src/Umbraco.Community.AIProvenance/Client
        run: |
          jq --arg version "$VERSION" '.version = $version' public/umbraco-package.json > umbraco-package.tmp
          mv umbraco-package.tmp public/umbraco-package.json

      - name: Build the backoffice extension
        working-directory: src/Umbraco.Community.AIProvenance/Client
        run: |
          npm ci
          npm run build

      - name: Build
        run: dotnet build src/Umbraco.Community.AIProvenance.slnx --configuration Release -p:Version=$VERSION

      - name: Test
        run: dotnet test tests/Umbraco.Community.AIProvenance.Tests --configuration Release --no-build --blame-hang-timeout 5m

      - name: Pack
        run: |
          dotnet pack src/Umbraco.Community.AIProvenance/Umbraco.Community.AIProvenance.csproj --configuration Release --no-build --output nupkg -p:Version=$VERSION
          dotnet pack src/Umbraco.Community.AIProvenance.UmbracoAI/Umbraco.Community.AIProvenance.UmbracoAI.csproj --configuration Release --no-build --output nupkg -p:Version=$VERSION

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: liamgold

      - name: Publish to NuGet using Trusted Publishing
        run: dotnet nuget push "nupkg/*.nupkg" --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
